    kind: gitlab_sort_dropdown_pending_apply
    selector: button#sort-projects-dropdown
    menu_selector: '#project-filter-form .js-project-filter-dropdown-wrap .dropdown-menu a[href*=sort]'
    apply_label: Apply sort
  gitlab.gl11.collapse_sidebar_not_tabbable:
    kind: gitlab_sidebar_toggle_keyboard_repair
    selector: aside a[role="button"][title="Toggle sidebar"]
  gitlab.gl12.collapse_sidebar_not_tabbable:
    kind: gitlab_sidebar_toggle_keyboard_repair
    selector: aside a[role="button"][title="Toggle sidebar"]
  gitlab.gl15.datepicker_month_switch_not_keyboard_reachable:
    kind: gitlab_pika_single_datepicker_keyboard_repair
