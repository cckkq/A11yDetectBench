      source_files:
      - >-
        accessibility-insights-web-main/src/assessments/keyboard-interaction/test-steps/character-key-shortcuts.tsx
      - accessibility-insights-web-main/src/content/test/keyboard/character-key-shortcuts.tsx
      - accessibility-insights-web-main/src/content/guideline-metadata.ts
      requirement_text: >-
        Single-character keyboard shortcuts must be turn-offable, remappable, or active only
        when the relevant component has focus.
    wcag:
      number: 2.1.4
      name: Character Key Shortcuts
      link_name: WCAG 2.1.4
      url: https://www.w3.org/WAI/WCAG21/Understanding/character-key-shortcuts.html
      criterion_text: >-
        If a keyboard shortcut is implemented in content using only letter (including upper-
        and lower-case letters), punctuation, number, or symbol characters, then at least
        one of the following is true: a mechanism is available to turn the shortcut off; a
        mechanism is available to remap the shortcut to use one or more non-printable keyboard
        characters; or the keyboard shortcut for a user interface component is only active
        when that component has focus.
  evidence_rule: >-
    Pressing / or ? while focus is outside an editable field moves focus to the Magento Admin
    global search input targeted by shortcuts on the customer totals report. The task path
    does not expose a way to turn off, remap, or limit that single-character shortcut to cases
    where the search input already has focus.
evaluation_logic:
- Verdict must be exactly correct.
- >-
  Target may use a different locator, but it must resolve to the same DOM or accessibility
  target as the gold selector.
- Behavior may use different wording, but it must satisfy the gold evidence rule.
- Reporting unrelated keyboard issues does not count for this task.
