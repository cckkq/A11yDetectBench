task_id: shopping_admin.pa50.keyboard_assessment.verify.level3.v1
instance_id: shopping_admin.pa50.keyboard_assessment
task_level: level3
source:
  record_file: redacted_source_record_for_double_anonymous_review
  page_id: PA50
  review_status: current_clean_inventory
page:
  site: shopping_admin
  page_name: Customer Order Count Report
  start_url: http://localhost:7780/admin/reports/report_customer/orders/
scope:
  assessment_scope: Keyboard assessment scope 1.1, 1.2, 1.3, 1.4, and 1.6
gold:
  issue_present: true
  expected_verdict: issue_found
  issues:
  - issue_id: shopping_admin.pa50.datepicker_month_switch_not_keyboard_reachable
    target:
      selector: '#ui-datepicker-div .ui-datepicker-prev, #ui-datepicker-div .ui-datepicker-next'
      description: the previous and next month links in the opened Customer Orders datepicker
      coverage_policy: representative_group
    criterion:
      issue_family: keyboard_nonreachable
      wcag_target: WCAG 2.1.1 Keyboard
      assessment_requirement: 1.1 Keyboard navigation
      ai_web:
        requirement_key: keyboard-navigation
        requirement_name: Keyboard navigation
        guidance_link_key: WCAG_2_1_1
        source_files:
        - >-
          accessibility-insights-web-main/src/assessments/keyboard-interaction/test-steps/keyboard-navigation.tsx
        - accessibility-insights-web-main/src/content/test/keyboard/keyboard-navigation.tsx
        - accessibility-insights-web-main/src/content/guideline-metadata.ts
        requirement_text: Users must be able to navigate to all interactive interface components
          using a keyboard.
      wcag:
        number: 2.1.1
        name: Keyboard
        link_name: WCAG 2.1.1
        url: https://www.w3.org/WAI/WCAG21/Understanding/keyboard.html
        criterion_text: >-
          All functionality of the content is operable through a keyboard interface without
          requiring specific timings for individual keystrokes, except where the underlying
          function requires input that depends on the path of the user's movement and not
          just the endpoints.
    evidence_rule: >-
      The target (the previous and next month links in the opened Customer Orders datepicker)
      is visible and pointer-operable or part of an active widget, but expected keyboard navigation
      cannot reach or complete operation of that same target. Reporting a different keyboard
      issue on the page does not satisfy this rule.
  - issue_id: shopping_admin.pa50.scope_select_context_change
    target:
      selector: button#store-change-button
      description: the All Websites scope selector button on the customer orders report
      coverage_policy: single
    criterion:
      issue_family: on_input
      wcag_target: WCAG 3.2.2 On Input
      assessment_requirement: 1.4 On input
      ai_web:
        requirement_key: on-input
        requirement_name: On input
        guidance_link_key: WCAG_3_2_2
        source_files:
        - >-
          accessibility-insights-web-main/src/assessments/keyboard-interaction/test-steps/on-input.tsx
        - accessibility-insights-web-main/src/content/test/keyboard/on-input.tsx
        - accessibility-insights-web-main/src/content/guideline-metadata.ts
        requirement_text: >-
          Changing a user interface component setting must not automatically cause a context
          change unless users are advised before using the component.
      wcag:
        number: 3.2.2
        name: On Input
        link_name: WCAG 3.2.2
        url: https://www.w3.org/WAI/WCAG21/Understanding/on-input.html
        criterion_text: >-
          Changing the setting of any user interface component does not automatically cause
          a change of context unless the user has been advised of the behavior before using
          the component.
    evidence_rule: >-
      The target control (the All Websites scope selector button on the customer orders report)
      changes page context, navigation state, result ordering, or equivalent page state immediately
      after the control value or selection changes, without a separate submit or apply action
      and without prior warning. Merely opening a menu is not sufficient.
