task_id: shopping_admin.pa01.keyboard_assessment.verify.level3.v1
instance_id: shopping_admin.pa01.keyboard_assessment
task_level: level3
source:
  record_file: redacted_source_record_for_double_anonymous_review
  page_id: PA01
  review_status: current_clean_inventory
page:
  site: shopping_admin
  page_name: Admin Dashboard
  start_url: http://localhost:7780/admin/admin/dashboard/
scope:
  assessment_scope: Keyboard assessment scope 1.1, 1.2, 1.3, 1.4, and 1.6
gold:
  issue_present: true
  expected_verdict: issue_found
  issues:
  - issue_id: shopping_admin.pa01.global_search_shortcut_active_outside_input
    target:
      selector: input#search-global
      description: the Magento Admin global search input targeted by slash and question-mark
        shortcuts
      coverage_policy: single
    criterion:
      issue_family: character_key_shortcuts
      wcag_target: WCAG 2.1.4 Character Key Shortcuts
      assessment_requirement: 1.6 Character key shortcuts
      ai_web:
        requirement_key: character-key-shortcuts
        requirement_name: Character key shortcuts
        guidance_link_key: WCAG_2_1_4
        source_files:
        - >-
          accessibility-insights-web-main/src/assessments/keyboard-interaction/test-steps/character-key-shortcuts.tsx
        - accessibility-insights-web-main/src/content/test/keyboard/character-key-shortcuts.tsx
        - accessibility-insights-web-main/src/content/guideline-metadata.ts
        requirement_text: >-
          Single-character keyboard shortcuts must be turn-offable, remappable, or active
          only when the relevant component has focus.
      wcag:
        number: 2.1.4
        name: Character Key Shortcuts
        link_name: WCAG 2.1.4
        url: https://www.w3.org/WAI/WCAG21/Understanding/character-key-shortcuts.html
        criterion_text: >-
          If a keyboard shortcut is implemented in content using only letter (including upper-
          and lower-case letters), punctuation, number, or symbol characters, then at least
          one of the following is true: a mechanism is available to turn the shortcut off;
          a mechanism is available to remap the shortcut to use one or more non-printable
          keyboard characters; or the keyboard shortcut for a user interface component is
          only active when that component has focus.
    evidence_rule: >-
      Pressing / or ? while focus is outside an editable field moves focus to the Magento
      Admin global search input targeted by slash and question-mark shortcuts. The task path
      does not expose a way to turn off, remap, or limit that single-character shortcut to
      cases where the search input already has focus.
  - issue_id: shopping_admin.pa01.store_view_context_change
    target:
      selector: button#store-change-button
      description: the All Store Views selector button on the Magento Admin dashboard
      coverage_policy: single
    criterion:
      issue_family: on_input
      wcag_target: WCAG 3.2.2 On Input
      assessment_requirement: 1.4 On input
      ai_web:
        requirement_key: on-input
        requirement_name: On input
        guidance_link_key: WCAG_3_2_2
        source_files:
        - >-
          accessibility-insights-web-main/src/assessments/keyboard-interaction/test-steps/on-input.tsx
        - accessibility-insights-web-main/src/content/test/keyboard/on-input.tsx
        - accessibility-insights-web-main/src/content/guideline-metadata.ts
        requirement_text: >-
          Changing a user interface component setting must not automatically cause a context
          change unless users are advised before using the component.
      wcag:
        number: 3.2.2
        name: On Input
        link_name: WCAG 3.2.2
        url: https://www.w3.org/WAI/WCAG21/Understanding/on-input.html
        criterion_text: >-
          Changing the setting of any user interface component does not automatically cause
          a change of context unless the user has been advised of the behavior before using
          the component.
    evidence_rule: >-
      The target control (the All Store Views selector button on the Magento Admin dashboard)
      changes page context, navigation state, result ordering, or equivalent page state immediately
      after the control value or selection changes, without a separate submit or apply action
      and without prior warning. Merely opening a menu is not sufficient.
