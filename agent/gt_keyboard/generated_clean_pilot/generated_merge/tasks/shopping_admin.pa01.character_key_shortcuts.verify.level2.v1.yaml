wcag_target: WCAG 2.1.4 Character Key Shortcuts
wcag_source_url: https://www.w3.org/WAI/WCAG21/Understanding/character-key-shortcuts.html
wcag_clause_text: >-
  If a keyboard shortcut is implemented in content using only letter (including upper- and
  lower-case letters), punctuation, number, or symbol characters, then at least one of the
  following is true: a mechanism is available to turn the shortcut off; a mechanism is available
  to remap the shortcut to use one or more non-printable keyboard characters; or the keyboard
  shortcut for a user interface component is only active when that component has focus.
