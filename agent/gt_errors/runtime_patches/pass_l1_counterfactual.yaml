version: 1
scope: pass_l1_counterfactual
patches:
  gitlab.gl11.e2.rule_violation_without_actionable_suggestion:
    kind: append_hint
    selector: .gl-alert-content
    match: Website url is not a valid URL
    hint: Use a complete URL such as https://example.com.
  gitlab.gl11.e4.field_level_error_text_without_live_semantics:
    kind: live_selector
    selector: input#user_name[name="user[name]"] + p.gl-field-error
    match: Using emojis in names seems fun
    role: alert
    live: assertive
  gitlab.gl16.e2.rule_violation_without_actionable_suggestion:
    kind: append_hint
