  issues:
  - issue_id: shopping.p07.e4.shared_footer_newsletter_error_without_live_semantics
    target:
      selector: form#newsletter-validate-detail input#newsletter
      description: the footer newsletter Email input on the stored payment methods page
      coverage_policy: single
    criterion:
      issue_family: status_messages
      wcag_target: WCAG 4.1.3 Status Messages
      assessment_requirement: E.4 Status Messages
      wcag:
        number: 4.1.3
        name: Status Messages
        link_name: WCAG 4.1.3
        url: https://www.w3.org/WAI/WCAG21/Understanding/status-messages.html
        criterion_text: >-
          In content implemented using markup languages, status messages can be programmatically
          determined through role or properties such that they can be presented to the user
          by assistive technologies without receiving focus.
    evidence_rule: >-
      Entering an invalid value in the target footer newsletter Email input produces active
      same-page error/status feedback at `div#newsletter-error`, but that message node and
      its relevant ancestors do not expose role, aria-live, or equivalent status-message semantics.
      Other conforming success feedback on the same page does not rescue this newsletter error
      message path.
