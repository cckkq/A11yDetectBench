wcag_criteria:
  L.1 Link Function:
    target: WCAG 4.1.2 Name, Role, Value
    text: >-
      For all user interface components (including but not limited to: form elements, links
      and components generated by scripts), the name and role can be programmatically determined;
      states, properties, and values that can be set by the user can be programmatically set;
      and notification of changes to these items is available to user agents, including assistive
      technologies.
    url: https://www.w3.org/TR/WCAG21/#name-role-value
  L.2 Link Purpose:
    target: WCAG 2.4.4 Link Purpose (In Context)
    text: >-
      The purpose of each link can be determined from the link text alone or from the link
      text together with its programmatically determined link context, except where the purpose
      of the link would be ambiguous to users in general.
    url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
