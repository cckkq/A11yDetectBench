  review_status: source_and_live_checked
page:
  site: gitlab
  page_name: User Profile
  start_url: http://localhost:8023/byteblaze
scope:
  issue_family: link_purpose
  wcag_target: WCAG 2.4.4 Link Purpose (In Context)
  assessment_requirement: L.2 Link Purpose
gold:
  issue_present: true
  expected_verdict: issue_found
  issues:
  - issue_id: gitlab.gl02.lp.profile_rss_subscribe_anchor_without_target_context
    target:
      selector: main#content-body a[title='Subscribe'][href*='.atom']
      description: the `Subscribe` RSS feed anchor element on the user profile page
      coverage_policy: single
    criterion:
      issue_family: link_purpose
      wcag_target: WCAG 2.4.4 Link Purpose (In Context)
      assessment_requirement: L.2 Link Purpose
      wcag:
        number: 2.4.4
        name: Link Purpose (In Context)
        link_name: Link Purpose (In Context)
        url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
        criterion_text: >-
          The purpose of each link can be determined from the link text alone or from the
          link text together with its programmatically determined link context, except where
          the purpose of the link would be ambiguous to users in general.
    evidence_rule: >-
      The matched link has computed name `Subscribe` and no description. The name does not
      identify that the link subscribes to the Byte Blaze user feed.
  - issue_id: gitlab.gl02.lp.empty_gravatar_avatar_anchor_without_name
    target:
      selector: main#content-body a[href*='gravatar.com/avatar']:has(img[alt=''])
      description: the external Gravatar profile avatar link with an empty image alt
      coverage_policy: single
    criterion:
      issue_family: link_purpose
      wcag_target: WCAG 2.4.4 Link Purpose (In Context)
      assessment_requirement: L.2 Link Purpose
      wcag:
        number: 2.4.4
        name: Link Purpose (In Context)
        link_name: Link Purpose (In Context)
        url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
        criterion_text: >-
          The purpose of each link can be determined from the link text alone or from the
          link text together with its programmatically determined link context, except where
          the purpose of the link would be ambiguous to users in general.
    evidence_rule: >-
      The matched profile avatar link has no text, no accessible name, and an image with empty
      `alt`. Its purpose cannot be determined from the link name or a programmatically associated
      context.
  - issue_id: gitlab.gl02.lp.dashboard_projects_view_all_without_section_context
    target:
      selector: main#content-body a.js-view-all[href='/users/byteblaze/projects']
      description: the `View all` anchor element in the projects overview section
      coverage_policy: single
    criterion:
      issue_family: link_purpose
      wcag_target: WCAG 2.4.4 Link Purpose (In Context)
      assessment_requirement: L.2 Link Purpose
      wcag:
        number: 2.4.4
        name: Link Purpose (In Context)
        link_name: Link Purpose (In Context)
        url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
        criterion_text: >-
          The purpose of each link can be determined from the link text alone or from the
          link text together with its programmatically determined link context, except where
          the purpose of the link would be ambiguous to users in general.
    evidence_rule: >-
      The matched link has computed name `View all` and no description. Its link name does
      not identify the projects destination, and the visual `Personal projects` heading is
      not supplied as programmatically determined link context.
