source:
  record_file: redacted_source_record_for_double_anonymous_review
  page_id: P01
  review_status: source_and_live_checked
page:
  site: shopping
  page_name: Customer Account
  start_url: http://localhost:7770/customer/account/
scope:
  assessment_scope: Links L.1-L.2
gold:
  issue_present: true
  expected_verdict: issue_found
  issues:
  - issue_id: shopping.p01.lp.account_dashboard_edit_links_without_section_context
    target:
      selector: .block-dashboard-info .box-actions > a.action.edit
      description: the two `Edit` links in the account information and newsletter boxes
      coverage_policy: representative_group
    criterion:
      issue_family: link_purpose
      wcag_target: WCAG 2.4.4 Link Purpose (In Context)
      assessment_requirement: L.2 Link Purpose
      wcag:
        number: 2.4.4
        name: Link Purpose (In Context)
        link_name: Link Purpose (In Context)
        url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
        criterion_text: >-
          The purpose of each link can be determined from the link text alone or from the
          link text together with its programmatically determined link context, except where
          the purpose of the link would be ambiguous to users in general.
    evidence_rule: >-
      The matched links are both named only `Edit` and have different destinations: account
      profile editing and newsletter management. The visual box labels are not exposed through
      the link name, description, ARIA association, same sentence, same paragraph, same list
      item, or same table cell.
  - issue_id: shopping.p01.lp.dashboard_view_all_links_without_section_context
    target:
      selector: .block-dashboard-orders .block-title a.action.view, .block-reorder a.action.view
      description: the two generic `View All` links in Recent Orders and Recently Ordered
      coverage_policy: representative_group
    criterion:
      issue_family: link_purpose
      wcag_target: WCAG 2.4.4 Link Purpose (In Context)
      assessment_requirement: L.2 Link Purpose
      wcag:
        number: 2.4.4
        name: Link Purpose (In Context)
        link_name: Link Purpose (In Context)
        url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
        criterion_text: >-
          The purpose of each link can be determined from the link text alone or from the
          link text together with its programmatically determined link context, except where
          the purpose of the link would be ambiguous to users in general.
    evidence_rule: >-
      The matched links are both named only `View All` and have different destinations: the
      full order history and the recent-orders table anchor element. The visible section labels
      `Recent Orders` and `Recently Ordered` are not programmatically bound to the links.
  - issue_id: shopping.p01.lp.order_view_order_without_row_header_context
    target:
      selector: table#my-orders-table a.action.view
      description: the repeated `View Order` links in the customer account recent-orders table
      coverage_policy: representative_group
    criterion:
      issue_family: link_purpose
      wcag_target: WCAG 2.4.4 Link Purpose (In Context)
      assessment_requirement: L.2 Link Purpose
      wcag:
        number: 2.4.4
        name: Link Purpose (In Context)
        link_name: Link Purpose (In Context)
        url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
        criterion_text: >-
          The purpose of each link can be determined from the link text alone or from the
          link text together with its programmatically determined link context, except where
          the purpose of the link would be ambiguous to users in general.
    evidence_rule: >-
      The matched links are named only `View Order`. Their action cells are associated only
      with the `Action` column header; the order numbers are ordinary sibling data cells without
      row-header, headers/id, or ARIA association to the links.
  - issue_id: shopping.p01.lp.order_reorder_without_row_header_context
    target:
      selector: table#my-orders-table a.action.order
      description: the repeated `Reorder` links in the customer account recent-orders table
      coverage_policy: representative_group
    criterion:
      issue_family: link_purpose
      wcag_target: WCAG 2.4.4 Link Purpose (In Context)
      assessment_requirement: L.2 Link Purpose
      wcag:
        number: 2.4.4
        name: Link Purpose (In Context)
        link_name: Link Purpose (In Context)
        url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
        criterion_text: >-
          The purpose of each link can be determined from the link text alone or from the
          link text together with its programmatically determined link context, except where
          the purpose of the link would be ambiguous to users in general.
    evidence_rule: >-
      The matched links are named only `Reorder`. Their action cells are associated only with
      the `Action` column header; the order ids are hidden in `data-post` values or ordinary
      sibling data cells, not in programmatically determined link context.
