gold:
  issue_present: true
  expected_verdict: issue_found
  issues:
  - issue_id: shopping.p02.lp.order_view_order_without_row_header_context
    target:
      selector: table#my-orders-table a.action.view
      description: the repeated `View Order` links in the order history table
      coverage_policy: representative_group
    criterion:
      issue_family: link_purpose
      wcag_target: WCAG 2.4.4 Link Purpose (In Context)
      assessment_requirement: L.2 Link Purpose
      wcag:
        number: 2.4.4
        name: Link Purpose (In Context)
        link_name: Link Purpose (In Context)
        url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
        criterion_text: >-
          The purpose of each link can be determined from the link text alone or from the
          link text together with its programmatically determined link context, except where
          the purpose of the link would be ambiguous to users in general.
    evidence_rule: >-
      The matched links are named only `View Order` and point to different order detail URLs.
      Their action cells are associated only with the `Action` column header; the order numbers
      are ordinary sibling data cells without row-header, headers/id, or ARIA association
      to the links.
  - issue_id: shopping.p02.lp.order_reorder_without_row_header_context
    target:
      selector: table#my-orders-table a.action.order
      description: the repeated `Reorder` links in the order history table
      coverage_policy: representative_group
    criterion:
      issue_family: link_purpose
      wcag_target: WCAG 2.4.4 Link Purpose (In Context)
      assessment_requirement: L.2 Link Purpose
      wcag:
        number: 2.4.4
        name: Link Purpose (In Context)
        link_name: Link Purpose (In Context)
        url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
        criterion_text: >-
          The purpose of each link can be determined from the link text alone or from the
          link text together with its programmatically determined link context, except where
          the purpose of the link would be ambiguous to users in general.
    evidence_rule: >-
      The matched links are named only `Reorder`. Their action cells are associated only with
      the `Action` column header; the order ids are hidden in `data-post` values or ordinary
      sibling data cells, not in programmatically determined link context.
  - issue_id: shopping.p02.lp.recently_ordered_view_all_without_section_context
    target:
      selector: .block-reorder a.action.view
      description: the generic `View All` link in the Recently Ordered block
      coverage_policy: single
    criterion:
      issue_family: link_purpose
      wcag_target: WCAG 2.4.4 Link Purpose (In Context)
      assessment_requirement: L.2 Link Purpose
      wcag:
        number: 2.4.4
        name: Link Purpose (In Context)
        link_name: Link Purpose (In Context)
        url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
        criterion_text: >-
          The purpose of each link can be determined from the link text alone or from the
          link text together with its programmatically determined link context, except where
          the purpose of the link would be ambiguous to users in general.
    evidence_rule: >-
      The matched link is named only `View All`. The visible `Recently Ordered` block title
      is not exposed through the link name, description, ARIA association, same sentence,
      same paragraph, same list item, or same table cell.
