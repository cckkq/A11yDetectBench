  issues:
  - issue_id: shopping_admin.pa02.lp.notification_read_details_without_row_context
    target:
      selector: '#notificationGrid_table td.col-actions a.action-details'
      description: the `Read Details` link in the Notifications grid Actions column
      coverage_policy: single
    criterion:
      issue_family: link_purpose
      wcag_target: WCAG 2.4.4 Link Purpose (In Context)
      assessment_requirement: L.2 Link Purpose
      wcag:
        number: 2.4.4
        name: Link Purpose (In Context)
        link_name: Link Purpose (In Context)
        url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
        criterion_text: >-
          The purpose of each link can be determined from the link text alone or from the
          link text together with its programmatically determined link context, except where
          the purpose of the link would be ambiguous to users in general.
    evidence_rule: >-
      The matched link has computed AX name `Read Details` and no description. Its action
      cell and associated column header only identify `Actions`; the notification message
      is in sibling `td.col-title` without row-header, headers/id, or ARIA association.
  - issue_id: shopping_admin.pa02.lp.notification_remove_without_row_context
