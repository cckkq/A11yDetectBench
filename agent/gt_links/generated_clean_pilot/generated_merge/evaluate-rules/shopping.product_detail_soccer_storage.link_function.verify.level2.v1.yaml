  issues:
  - issue_id: shopping.p22.lf.product_detail_add_to_compare_command_anchor
    target:
      selector: .product-info-main a.action.tocompare
      description: the `Add to Compare` anchor element in the product action links
      coverage_policy: single
    criterion:
      issue_family: link_function
      wcag_target: WCAG 4.1.2 Name, Role, Value
      assessment_requirement: L.1 Link Function
      wcag:
        number: 4.1.2
        name: Name, Role, Value
        link_name: Name, Role, Value
        url: https://www.w3.org/TR/WCAG21/#name-role-value
        criterion_text: >-
          For all user interface components (including but not limited to: form elements,
          links and components generated by scripts), the name and role can be programmatically
          determined; states, properties, and values that can be set by the user can be programmatically
          set; and notification of changes to these items is available to user agents, including
          assistive technologies.
    evidence_rule: >-
      The matched anchor element has `href='#'` and a `data-post` payload targeting `/catalog/product_compare/add/`.
      Activation adds the current product to the compare list and shows page feedback instead
      of navigating to link content.
  - issue_id: shopping.p22.lf.product_detail_panel_tab_anchor_without_widget_role
    target:
      selector: .product.data.items a.data.switch
      description: the `Details` and `Reviews` product information tab anchor elements
      coverage_policy: representative_group
    criterion:
      issue_family: link_function
      wcag_target: WCAG 4.1.2 Name, Role, Value
      assessment_requirement: L.1 Link Function
      wcag:
        number: 4.1.2
        name: Name, Role, Value
        link_name: Name, Role, Value
        url: https://www.w3.org/TR/WCAG21/#name-role-value
        criterion_text: >-
          For all user interface components (including but not limited to: form elements,
          links and components generated by scripts), the name and role can be programmatically
          determined; states, properties, and values that can be set by the user can be programmatically
          set; and notification of changes to these items is available to user agents, including
          assistive technologies.
    evidence_rule: >-
      The matched anchor elements are exposed as links with hrefs to page fragments, but activation
      switches the visible product information panel in place. The interactive tab state is
      represented on parent title elements, while the focusable anchor elements themselves
      are ordinary links.
