  issues:
  - issue_id: gitlab.gl01.lf.create_new_dropdown_anchor_without_widget_role
    target:
      selector: header a[data-qa-selector='new_menu_toggle']
      description: the `Create new...` anchor element in the GitLab Dashboard top navigation
      coverage_policy: single
    criterion:
      issue_family: link_function
      wcag_target: WCAG 4.1.2 Name, Role, Value
      assessment_requirement: L.1 Link Function
      wcag:
        number: 4.1.2
        name: Name, Role, Value
        link_name: Name, Role, Value
        url: https://www.w3.org/TR/WCAG21/#name-role-value
        criterion_text: >-
          For all user interface components (including but not limited to: form elements,
          links and components generated by scripts), the name and role can be programmatically
          determined; states, properties, and values that can be set by the user can be programmatically
          set; and notification of changes to these items is available to user agents, including
          assistive technologies.
    evidence_rule: >-
      The matched `Create new...` anchor element is exposed as a link, but activation opens
      the create menu in place. The element has `data-toggle='dropdown'` and no ARIA widget
      role for the dropdown-control behavior.
