task_id: shopping_admin.admin_sales_order_status.links_assessment.verify.level3.v1
instance_id: shopping_admin.admin_sales_order_status.links_assessment
task_level: level3
source:
  record_file: redacted_source_record_for_double_anonymous_review
  page_id: PA61
  review_status: source_and_live_checked
page:
  site: shopping_admin
  page_name: Order Status
  start_url: http://localhost:7780/admin/sales/order_status/
scope:
  assessment_scope: Links L.1-L.2
gold:
  issue_present: true
  expected_verdict: issue_found
  issues:
  - issue_id: shopping_admin.pa61.lf.left_nav_disclosure_anchor_without_widget_role
    target:
      selector: '#nav a[href=''#''][onclick*=''return false'']'
      description: the top-level admin left navigation anchor elements on the Order Status
        page
      coverage_policy: representative_group
    criterion:
      issue_family: link_function
      wcag_target: WCAG 4.1.2 Name, Role, Value
      assessment_requirement: L.1 Link Function
      wcag:
        number: 4.1.2
        name: Name, Role, Value
        link_name: Name, Role, Value
        url: https://www.w3.org/TR/WCAG21/#name-role-value
        criterion_text: >-
          For all user interface components (including but not limited to: form elements,
          links and components generated by scripts), the name and role can be programmatically
          determined; states, properties, and values that can be set by the user can be programmatically
          set; and notification of changes to these items is available to user agents, including
          assistive technologies.
    evidence_rule: >-
      The matched anchor elements have `href='#'` and `onclick='return false;'` without button/disclosure
      roles or `aria-expanded` state. Activation expands a left navigation submenu in place
      while the current Order Status page remains loaded.
  - issue_id: shopping_admin.pa61.lf.order_status_unassign_data_post_anchor
    target:
      selector: a[href='#'][data-post*='unassign']
      description: the `Unassign` command anchor elements in the order status grid
      coverage_policy: representative_group
    criterion:
      issue_family: link_function
      wcag_target: WCAG 4.1.2 Name, Role, Value
      assessment_requirement: L.1 Link Function
      wcag:
        number: 4.1.2
        name: Name, Role, Value
        link_name: Name, Role, Value
        url: https://www.w3.org/TR/WCAG21/#name-role-value
        criterion_text: >-
          For all user interface components (including but not limited to: form elements,
          links and components generated by scripts), the name and role can be programmatically
          determined; states, properties, and values that can be set by the user can be programmatically
          set; and notification of changes to these items is available to user agents, including
          assistive technologies.
    evidence_rule: >-
      The matched anchor elements are exposed as links with `href='#'`, but their `data-post`
      payload submits order-status unassign commands. They do not navigate to link content
      and do not expose a button or command role.
  - issue_id: shopping_admin.pa61.lp.order_status_unassign_without_row_context
    target:
      selector: '#sales_order_status_grid_table a[href=''#''][data-post*=''unassign'']'
      description: the ten `Unassign` action links in the order status grid
      coverage_policy: representative_group
    criterion:
      issue_family: link_purpose
      wcag_target: WCAG 2.4.4 Link Purpose (In Context)
      assessment_requirement: L.2 Link Purpose
      wcag:
        number: 2.4.4
        name: Link Purpose (In Context)
        link_name: Link Purpose (In Context)
        url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
        criterion_text: >-
          The purpose of each link can be determined from the link text alone or from the
          link text together with its programmatically determined link context, except where
          the purpose of the link would be ambiguous to users in general.
    evidence_rule: >-
      The matched links all have the accessible name `Unassign` and no programmatically associated
      status/state context. The action cell text is only `Unassign`, the `Action` header is
      not bound with `headers` or `scope`, and the status/state values in sibling cells or
      `data-post` are not part of the link name or a valid programmatic context.
