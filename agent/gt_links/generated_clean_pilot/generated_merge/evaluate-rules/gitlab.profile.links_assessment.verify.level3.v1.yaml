source:
  record_file: redacted_source_record_for_double_anonymous_review
  page_id: GL11
  review_status: source_and_live_checked
page:
  site: gitlab
  page_name: Profile
  start_url: http://localhost:8023/-/profile
scope:
  assessment_scope: Links L.1-L.2
gold:
  issue_present: true
  expected_verdict: issue_found
  issues:
  - issue_id: gitlab.gl11.lf.create_new_dropdown_anchor_without_widget_role
    target:
      selector: header a[data-qa-selector='new_menu_toggle']
      description: the `Create new...` anchor element in the GitLab Profile top navigation
      coverage_policy: single
    criterion:
      issue_family: link_function
      wcag_target: WCAG 4.1.2 Name, Role, Value
      assessment_requirement: L.1 Link Function
      wcag:
        number: 4.1.2
        name: Name, Role, Value
        link_name: Name, Role, Value
        url: https://www.w3.org/TR/WCAG21/#name-role-value
        criterion_text: >-
          For all user interface components (including but not limited to: form elements,
          links and components generated by scripts), the name and role can be programmatically
          determined; states, properties, and values that can be set by the user can be programmatically
          set; and notification of changes to these items is available to user agents, including
          assistive technologies.
    evidence_rule: >-
      The matched `Create new...` anchor element is exposed as a link, but activation opens
      the create menu in place. The element has `data-toggle='dropdown'`, no ARIA widget role,
      and no `aria-expanded` state for the dropdown-control behavior.
  - issue_id: gitlab.gl11.lf.merge_requests_dropdown_anchor_without_widget_role
    target:
      selector: header a[data-qa-selector='merge_requests_shortcut_button']
      description: the `Merge requests` anchor element in the GitLab Profile top navigation
      coverage_policy: single
    criterion:
      issue_family: link_function
      wcag_target: WCAG 4.1.2 Name, Role, Value
      assessment_requirement: L.1 Link Function
      wcag:
        number: 4.1.2
        name: Name, Role, Value
        link_name: Name, Role, Value
        url: https://www.w3.org/TR/WCAG21/#name-role-value
        criterion_text: >-
          For all user interface components (including but not limited to: form elements,
          links and components generated by scripts), the name and role can be programmatically
          determined; states, properties, and values that can be set by the user can be programmatically
          set; and notification of changes to these items is available to user agents, including
          assistive technologies.
    evidence_rule: >-
      The matched `Merge requests` anchor element is exposed as a link, but activation opens
      the merge-request menu in place. The element has `data-toggle='dropdown'`, no ARIA widget
      role, and no `aria-expanded` state for the dropdown-control behavior.
  - issue_id: gitlab.gl11.lp.empty_help_icon_anchor_without_name
    target:
      selector: main#content-body a[href*='make-your-user-profile-page-private']
      description: the empty help icon link beside the Private profile setting
      coverage_policy: single
    criterion:
      issue_family: link_purpose
      wcag_target: WCAG 2.4.4 Link Purpose (In Context)
      assessment_requirement: L.2 Link Purpose
      wcag:
        number: 2.4.4
        name: Link Purpose (In Context)
        link_name: Link Purpose (In Context)
        url: https://www.w3.org/TR/WCAG21/#link-purpose-in-context
        criterion_text: >-
          The purpose of each link can be determined from the link text alone or from the
          link text together with its programmatically determined link context, except where
          the purpose of the link would be ambiguous to users in general.
    evidence_rule: >-
      The matched help icon anchor element has an empty accessible name. The nearby Private
      profile label is visual context, but it is not exposed as the link name or accessible
      description.
