  - issue_id: shopping.p19.lf.compare_page_print_command_anchor
    target:
      selector: a.action.print
      description: the `Print This Page` anchor element above the compare products table
      coverage_policy: single
    criterion:
      issue_family: link_function
      wcag_target: WCAG 4.1.2 Name, Role, Value
      assessment_requirement: L.1 Link Function
      wcag:
        number: 4.1.2
        name: Name, Role, Value
        link_name: Name, Role, Value
        url: https://www.w3.org/TR/WCAG21/#name-role-value
        criterion_text: >-
          For all user interface components (including but not limited to: form elements,
          links and components generated by scripts), the name and role can be programmatically
          determined; states, properties, and values that can be set by the user can be programmatically
          set; and notification of changes to these items is available to user agents, including
          assistive technologies.
    evidence_rule: >-
      The matched anchor element has `href='#'` and visible text `Print This Page`. Activation
      invokes print behavior for the current compare page instead of navigating to link content.
  - issue_id: shopping.p19.lf.compare_page_remove_product_command_anchor
    target:
      selector: .table-comparison a.action.delete
      description: the visible `Remove Product` anchor elements in the compare products table
      coverage_policy: representative_group
    criterion:
      issue_family: link_function
      wcag_target: WCAG 4.1.2 Name, Role, Value
      assessment_requirement: L.1 Link Function
      wcag:
        number: 4.1.2
        name: Name, Role, Value
        link_name: Name, Role, Value
        url: https://www.w3.org/TR/WCAG21/#name-role-value
        criterion_text: >-
          For all user interface components (including but not limited to: form elements,
          links and components generated by scripts), the name and role can be programmatically
          determined; states, properties, and values that can be set by the user can be programmatically
          set; and notification of changes to these items is available to user agents, including
          assistive technologies.
    evidence_rule: >-
      The matched anchor elements have `href='#'`, title `Remove Product`, and `data-post`
      payloads targeting `/catalog/product_compare/remove/` with confirmation. Activation
      starts a remove-product command for a compare table item instead of navigating to link
      content.
