  issues:
  - issue_id: gitlab.gl01.f21t3.project_initial_avatar_links_no_visible_focus
    target:
      selector: .projects-list a.project
      description: the project-row initial-letter avatar links in the GitLab Dashboard project
        list
      coverage_policy: representative_group
    criterion:
      issue_family: visible_focus
      wcag_target: WCAG 2.4.7 Focus Visible
      assessment_requirement: F.1 Visible Focus
      ai_web:
        requirement_key: visible-focus
        requirement_name: Visible focus
        guidance_link_key: WCAG_2_4_7
        source_files:
        - >-
          accessibility-insights-web-main/src/assessments/visible-focus-order/test-steps/visible-focus.tsx
        - accessibility-insights-web-main/src/content/test/focus/visible-focus.tsx
        - accessibility-insights-web-main/src/content/guideline-metadata.ts
        requirement_text: Components must provide a visible indication when they have the
          input focus.
      wcag:
        number: 2.4.7
        name: Focus Visible
        link_name: WCAG 2.4.7
        url: https://www.w3.org/WAI/WCAG21/Understanding/focus-visible.html
        criterion_text: >-
          Any keyboard operable user interface has a mode of operation where the keyboard
          focus indicator is visible.
    evidence_rule: >-
      The project-row initial-letter avatar links receive keyboard focus, but no user-perceivable
      focus indicator is visible while one of those links is keyboard-focused. Mouse clicks,
      JavaScript focus, browser-use overlays, and imperceptible computed-style differences
      do not count as focus evidence.
